version: '3.8'

services:
  # TimescaleDB / PostgreSQL Time-Series Database
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: smart_irrigation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_irrigation}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_irrigation}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eclipse Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smart_irrigation_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # FastAPI Backend Service (API + MQTT Subscriber + Weather Poller)
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: smart_irrigation_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_irrigation}
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - TOMORROW_API_KEY=${TOMORROW_API_KEY}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend

  # Next.js Frontend Application & PWA
  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    container_name: smart_irrigation_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"

  # MLflow Tracking Server & Model Registry
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: smart_irrigation_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --backend-store-uri sqlite:////mlruns/mlflow.db --default-artifact-root /mlruns --host 0.0.0.0 --port 5000

  # AI-Powered Smart Irrigation ML Serving Engine
  ml_service:
    build:
      context: .
      dockerfile: infra/Dockerfile.ml
    container_name: smart_irrigation_ml
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_irrigation}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ML_SEED=${ML_SEED:-42}
      - ML_SEQUENCE_LENGTH=${ML_SEQUENCE_LENGTH:-12}
    ports:
      - "8001:8001"
    volumes:
      - ./ml:/app/ml
      - ./backend:/app/backend

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  mlflow_data:
